# Render Blueprint — deploys the entire backend stack from one file.
#
# NOT VERIFIED AGAINST A REAL RENDER DEPLOYMENT. Render's platform and docs
# aren't reachable from the sandbox this was written in, and no Render
# account was available to test-deploy with. This is a best-effort starting
# point based on Render's documented blueprint schema — expect to need small
# adjustments once you actually import it (Render validates the file and
# will tell you exactly what's wrong, if anything, at import time).
#
# Usage: Render dashboard -> New -> Blueprint -> connect this repo -> Render
# reads this file automatically from the repo root.
#
# Redis: Render's managed Redis-compatible offering is called "Key Value".
# If `type: keyvalue` below isn't accepted when you import this, check
# Render's current docs for the exact service type name (this is the one
# part of this file most likely to have changed since training).

databases:
  - name: careerpilot-postgres
    databaseName: careerpilot
    user: careerpilot
    plan: free
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: careerpilot-redis
    plan: free
    ipAllowList: []

  - type: web
    name: careerpilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false # set this to your deployed frontend URL after it exists
      - key: DATABASE_URL
        fromDatabase:
          name: careerpilot-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: careerpilot-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: careerpilot-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: careerpilot-redis
          type: keyvalue
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false # set manually in the Render dashboard — never commit real keys
      - key: STORAGE_ROOT
        value: /app/storage
    # NOTE: no persistent disk here — Render's free tier does not support
    # them (confirmed by a real blueprint validation attempt, not assumed).
    # This means uploaded resumes and generated documents will NOT persist
    # across restarts/redeploys on the free plan, and are not shared with
    # the celery-worker service either (each service's ephemeral filesystem
    # is separate). Fine for demoing the app; for real persistence, either
    # upgrade to a paid Render plan with a disk, or swap StorageService's
    # backend to an S3-compatible one (e.g. Cloudflare R2's free tier) —
    # storage_service.py's StorageBackend interface was built for exactly
    # this kind of swap.

# --- Celery worker + beat intentionally omitted from this free-tier blueprint ---
#
# Confirmed via a real deploy attempt: Render's free plan does not support
# the Background Worker service type at all (rejected with "service type
# is not available for this plan"), regardless of the disk issue fixed
# above. Running them requires a paid plan.
#
# This is not a functional blocker for the app itself: every AI/resume/job
# endpoint calls its service synchronously within the request (see
# PROJECT_STATUS.md's "Deviations from the approved design" — this was a
# deliberate choice in Sprint 2, matching Sprint 1's existing convention).
# The only thing actually lost by not running Celery here is the optional
# hourly auto-sync schedule (celery_app.py's beat_schedule) — manual sync
# via POST /companies/{id}/sync still works fine without it.
#
# To add them back on a paid plan, restore two services shaped like
# careerpilot-backend above but with `type: worker` instead of `type: web`,
# `plan: starter` (or higher) instead of `plan: free`, and
# `dockerCommand: celery -A app.core.celery_app worker --loglevel=info`
# (or `... beat --loglevel=info` for the scheduler) instead of relying on
# the Dockerfile's default CMD.